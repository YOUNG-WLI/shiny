<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ccecff">
  <meta name="description" content="샤이니 컬러즈 노래의 일본어 가사, 한글 발음, 한국어 번역을 함께 읽는 노래장">
  <title>한 소절 · 샤이니 컬러즈 가사</title>
  <link rel="stylesheet" href="styles.css">
  <script src="songs.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#lyrics">가사로 바로 가기</a>
  <header class="site-header">
    <p class="site-name">한 소절</p>
    <div class="song-picker">
      <label for="song-select">곡 선택</label>
      <select id="song-select" disabled><option>곡을 불러오는 중…</option></select>
    </div>
    <details class="settings">
      <summary>보기 설정</summary>
      <div class="settings-content">
        <fieldset><legend>표시할 가사</legend>
          <label><input type="checkbox" data-layer="original" checked> 일본어</label>
          <label><input type="checkbox" data-layer="pronunciation" checked> 한글 발음</label>
          <label><input type="checkbox" data-layer="translation" checked> 한국어 번역</label>
        </fieldset>
        <div class="size-control"><span>글자 크기</span><button id="smaller" type="button" aria-label="모든 가사 글자 작게">−</button><output id="font-size" aria-live="polite">16px</output><button id="larger" type="button" aria-label="모든 가사 글자 크게">＋</button></div>
      </div>
    </details>
  </header>
  <main>
    <header class="song-heading">
      <p id="song-album"></p>
      <h1 id="song-title" lang="ja"></h1>
      <p id="song-vocal" lang="ja"></p>
    </header>
    <div id="load-error" role="alert" hidden>곡 데이터를 불러오지 못했습니다. 페이지를 새로고침해 주세요.</div>
    <article id="lyrics" aria-label="일본어 원문, 한글 발음, 한국어 번역" tabindex="-1"></article>
    <nav class="song-navigation" aria-label="이전 곡과 다음 곡">
      <a id="previous-song" hidden>← 이전 곡</a>
      <span id="song-position"></span>
      <a id="next-song" hidden>다음 곡 →</a>
    </nav>
  </main>
  <footer><a href="#" id="back-to-top">맨 위로 ↑</a><p>한 소절 · HOPEFUL FE@THERS</p></footer>
  <p id="status" class="sr-only" role="status"></p>
  <noscript><p class="noscript">가사를 보려면 브라우저에서 JavaScript를 켜주세요.</p></noscript>
</body>
</html>
